<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <!--
    v2 — the one page.

    Driven entirely by what uiBootstrap() and uiListEntries() return: the tabs,
    the table columns, the status options and the date dialog all come from
    SECTIONS on the server. There is no per-section code in here, which is the
    whole reason v1's four near-identical loadX/renderX/toggleX sets are gone.

    Three rules this page keeps:
      - Loading, empty and error are distinct states. A failure must never look
        like "no data", which is how v1 hid its load failures.
      - A status change reports what actually happened. setStatus can move the
        status and still fail to rename a file; that shows as a warning, not a
        tick.
      - No confirmation on a status change, because every one is reversible.
        Confirmations on frequent actions only train you to tap through them.
  -->
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --line: #e2e5ea;
      --text: #1c1f24;
      --muted: #6b7280;
      --accent: #1a73e8;
      --warn: #b26a00;
      --warn-bg: #fff4e0;
      --err: #b3261e;
      --err-bg: #fdecea;
      --ok: #1e7d45;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
      padding-bottom: 3rem;
    }

    header {
      display: flex; align-items: baseline; gap: .75rem;
      padding: .85rem 1rem;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 5;
    }
    header h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
    header .who { color: var(--muted); font-size: .8rem; margin-left: auto; }
    header button { margin-left: .5rem; }

    button, select, input {
      font: inherit; color: inherit;
      border: 1px solid var(--line); border-radius: 8px;
      background: var(--card); padding: .4rem .6rem;
    }
    button { cursor: pointer; }
    button.primary {
      background: var(--accent); color: #fff; border-color: var(--accent);
      font-weight: 600; padding: .7rem 1rem; width: 100%;
    }
    button.link { border: 0; background: none; color: var(--accent); padding: .2rem; }

    nav#tabs {
      display: flex; gap: .4rem; overflow-x: auto;
      padding: .6rem 1rem; background: var(--card);
      border-bottom: 1px solid var(--line);
    }
    nav#tabs button {
      white-space: nowrap; border-radius: 999px; padding: .4rem .85rem;
      color: var(--muted);
    }
    nav#tabs button[aria-selected="true"] {
      background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
    }

    main { padding: 1rem; max-width: 1100px; margin: 0 auto; }

    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: .85rem; margin-bottom: 1rem;
    }

    /* Reference block: identifiers you retype into Finanças, so tap to copy. */
    #reference { display: none; }
    #reference h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em;
      color: var(--muted); margin: 0 0 .5rem; }
    #reference .items { display: flex; flex-wrap: wrap; gap: .5rem; }
    #reference button {
      display: flex; flex-direction: column; align-items: flex-start;
      gap: .1rem; padding: .5rem .7rem; text-align: left;
    }
    #reference .label { font-size: .7rem; color: var(--muted); }
    #reference .value { font-variant-numeric: tabular-nums; font-weight: 600; }

    #filters { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: 1rem; }
    #filters label { font-size: .8rem; color: var(--muted); }
    #filters .count { margin-left: auto; font-size: .8rem; color: var(--muted); }

    #state { padding: 2rem 1rem; text-align: center; color: var(--muted); }
    #state.error { color: var(--err); background: var(--err-bg); border-radius: 12px; text-align: left; }
    #state.error strong { display: block; margin-bottom: .3rem; }
    #state.hidden, #tableCard.hidden { display: none; }

    #tableCard { background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: .9rem; }
    th, td { text-align: left; padding: .55rem .7rem; border-bottom: 1px solid var(--line);
      white-space: nowrap; vertical-align: middle; }
    th { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em;
      color: var(--muted); font-weight: 600; background: #fbfcfd; position: sticky; top: 0; }
    tr:last-child td { border-bottom: 0; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    td.notes { white-space: normal; min-width: 12rem; color: var(--muted); }
    tr.busy { opacity: .5; }

    select.status { font-size: .85rem; padding: .3rem .4rem; }
    .chip {
      border: 1px solid var(--line); border-radius: 999px;
      padding: .2rem .55rem; font-size: .78rem; background: #fbfcfd;
    }
    button.chip { cursor: pointer; }
    button.chip.blank { color: var(--muted); border-style: dashed; }
    /* A state the row has not reached: shown so the column still lines up, but
       not offered, because the server will not write it. */
    span.chip.unreached { color: var(--muted); border: 0; background: none; opacity: .5; }
    .awaiting { color: var(--warn); }
    .docs a { color: var(--accent); text-decoration: none; font-size: .8rem; }
    .docs a + a { margin-left: .4rem; }
    .docs .none { color: var(--muted); font-size: .8rem; }

    /* Dialog: one tap to accept, but the date is always seen before it is
       written, because Claimed / Settled / Received are usually backdated. */
    #overlay {
      position: fixed; inset: 0; background: rgba(20, 22, 26, .45);
      display: none; align-items: center; justify-content: center; padding: 1rem; z-index: 20;
    }
    #overlay.open { display: flex; }
    #dialog { background: var(--card); border-radius: 16px; padding: 1.25rem;
      width: 100%; max-width: 22rem; text-align: center; }
    #dialog h2 { margin: 0 0 1rem; font-size: 1.05rem; }
    #dialog .or { color: var(--muted); font-size: .8rem; margin: .9rem 0 .5rem; }
    #dialog .pick { display: flex; gap: .5rem; }
    #dialog .pick input { flex: 1; }
    #dialog .extra { margin-top: .75rem; display: flex; justify-content: center; gap: 1rem; }

    /* The form. Same overlay treatment as the date dialog, but scrollable and
       left-aligned, because it is a column of fields rather than one choice. */
    #formOverlay {
      position: fixed; inset: 0; background: rgba(20, 22, 26, .45);
      display: none; align-items: flex-start; justify-content: center;
      padding: 1rem; z-index: 25; overflow-y: auto;
    }
    #formOverlay.open { display: flex; }
    #formCard {
      background: var(--card); border-radius: 16px; padding: 1.1rem;
      width: 100%; max-width: 30rem; margin: auto;
    }
    #formCard h2 { margin: 0 0 .9rem; font-size: 1.05rem; }
    #formCard .field { margin-bottom: .8rem; }
    #formCard label {
      display: block; font-size: .78rem; color: var(--muted);
      margin-bottom: .25rem; font-weight: 600;
    }
    #formCard label .req { color: var(--err); margin-left: .15rem; }
    #formCard input, #formCard select { width: 100%; padding: .55rem .6rem; }
    #formCard input[type="file"] { padding: .45rem; background: #fbfcfd; }
    #formCard .field.missing input, #formCard .field.missing select { border-color: var(--err); }
    /* What the registry thinks, when it is not confident enough to fill it in.
       Shown rather than applied, because a wrong NIF is worse than a blank. */
    #formCard .hint { font-size: .75rem; color: var(--muted); margin-top: .25rem; }
    #formCard .hint.suggest { color: var(--warn); }
    #formCard .hint button { border: 0; background: none; color: var(--accent);
      padding: 0 .2rem; font-size: .75rem; text-decoration: underline; }
    #formCard .actions { margin-top: 1.1rem; }
    #formCard .actions .secondary {
      display: flex; justify-content: center; margin-top: .6rem;
    }
    #confirmOverlay {
      position: fixed; inset: 0; background: rgba(20, 22, 26, .45);
      display: none; align-items: center; justify-content: center; padding: 1rem; z-index: 30;
    }
    #confirmOverlay.open { display: flex; }
    #confirmCard { background: var(--card); border-radius: 16px; padding: 1.25rem;
      width: 100%; max-width: 22rem; text-align: center; }
    #confirmCard h2 { margin: 0 0 .5rem; font-size: 1.05rem; }
    #confirmCard p { margin: 0 0 1rem; font-size: .87rem; color: var(--muted); }
    #confirmCard .extra { margin-top: .75rem; }
    #confirmCard button.primary.destructive {
      background: var(--err); border-color: var(--err);
    }

    /* Archive view: same table, visibly not the live one. */
    body.archive #tableCard { border-color: var(--warn); }
    #archiveBar { display: none; align-items: center; gap: .6rem; margin-bottom: 1rem;
      padding: .55rem .8rem; border-radius: 10px;
      background: var(--warn-bg); color: var(--warn); font-size: .85rem; }
    body.archive #archiveBar { display: flex; }
    #archiveBar .grow { margin-left: auto; }
    td.rowActions { white-space: nowrap; }
    td.rowActions button { font-size: .78rem; padding: .25rem .5rem; }
    button.danger { color: var(--err); border-color: var(--err); }

    #formNote { font-size: .8rem; margin-bottom: .8rem; display: none; }
    #formNote.show { display: block; color: var(--warn); background: var(--warn-bg);
      border-radius: 8px; padding: .5rem .6rem; }

    #toast {
      position: fixed; left: 50%; bottom: 1rem; transform: translateX(-50%);
      max-width: min(30rem, calc(100vw - 2rem));
      background: var(--text); color: #fff; padding: .7rem .9rem; border-radius: 10px;
      font-size: .85rem; opacity: 0; pointer-events: none; transition: opacity .18s;
      z-index: 30; white-space: pre-line;
    }
    #toast.show { opacity: 1; }
    #toast.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); }
    #toast.error { background: var(--err-bg); color: var(--err); border: 1px solid var(--err); }
  </style>
</head>

<body>
  <header>
    <h1>HelpfulForms</h1>
    <span class="who" id="who"></span>
    <button id="newEntry" type="button">New</button>
    <button id="showArchive" type="button">Archive</button>
    <button id="refresh" type="button">Refresh</button>
  </header>

  <nav id="tabs" role="tablist"></nav>

  <main>
    <section class="card" id="reference">
      <h2>For the claim form</h2>
      <div class="items" id="referenceItems"></div>
    </section>

    <div id="archiveBar">
      <span id="archiveCount"></span>
      <span class="grow"></span>
      <button id="archiveBack" type="button">Back to entries</button>
    </div>

    <div id="filters"></div>

    <div id="state">Loading…</div>
    <div id="tableCard" class="hidden"><table id="table"></table></div>
  </main>

  <div id="overlay">
    <div id="dialog" role="dialog" aria-modal="true">
      <h2 id="dialogTitle"></h2>
      <button class="primary" id="dialogPrimary" type="button"></button>
      <p class="or">or pick a date</p>
      <div class="pick">
        <!-- Native date input, so iOS opens the system wheel rather than
             anything hand-built. -->
        <input type="date" id="dialogDate">
        <button id="dialogOk" type="button">OK</button>
      </div>
      <div class="extra">
        <button class="link" id="dialogClear" type="button">Clear date</button>
        <button class="link" id="dialogCancel" type="button">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Built from meta.form, which the server derives from SECTIONS. Nothing
       section-specific is written here. -->
  <div id="formOverlay">
    <div id="formCard" role="dialog" aria-modal="true">
      <h2 id="formTitle"></h2>
      <div id="formNote"></div>
      <div id="formFields"></div>
      <div class="actions">
        <!-- One control. After a warning this button relabels itself to
             "Save incomplete", so what pressing it will do is written on it -
             rather than a second, link-styled button that reads as a caption. -->
        <button class="primary" id="formSave" type="button">Save</button>
        <div class="secondary">
          <button class="link" id="formCancel" type="button">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Confirmations are reserved for the two actions that are not freely
       reversible. Status changes deliberately have none. -->
  <div id="confirmOverlay">
    <div id="confirmCard" role="dialog" aria-modal="true">
      <h2 id="confirmTitle"></h2>
      <p id="confirmBody"></p>
      <button class="primary" id="confirmOk" type="button"></button>
      <div class="extra"><button class="link" id="confirmCancel" type="button">Cancel</button></div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    /* ------------------------------- state -------------------------------- */

    var app = {
      today: '',
      sections: [],       // metadata from the server, in SECTIONS order
      current: null,      // section key on screen
      meta: null,         // metadata for the current section
      rows: [],           // rows as the server last reported them
      filters: { status: '', category: '' },
      dialog: null,       // what the open dialog will do when accepted
      form: null,         // non-null while the new-entry form is open
      archive: false,     // showing the archive rather than the live entries
      confirm: null       // what the open confirmation will do when accepted
    };

    var el = function (id) { return document.getElementById(id); };

    /* ----------------------------- utilities ------------------------------ */

    function escapeHtml(value) {
      return String(value === null || value === undefined ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                  'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    /** "2026-08-08" -> "8 Aug". Anything unparseable comes back verbatim. */
    function dayLabel(iso) {
      var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
      if (!m) return String(iso || '');
      return Number(m[3]) + ' ' + MONTHS[Number(m[2]) - 1];
    }

    var toastTimer = null;
    function toast(message, kind) {
      var node = el('toast');
      node.textContent = message;
      node.className = 'show' + (kind ? ' ' + kind : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { node.className = ''; }, kind === 'error' ? 9000 : 5000);
    }

    /** Loading / empty / error are distinct, and only one is ever on screen. */
    function showState(kind, message) {
      var state = el('state');
      var table = el('tableCard');
      if (kind === 'rows') {
        state.className = 'hidden';
        table.className = '';
        return;
      }
      table.className = 'hidden';
      state.className = kind === 'error' ? 'error' : '';
      state.innerHTML = kind === 'error'
        ? '<strong>Could not load this section.</strong>' + escapeHtml(message)
        : escapeHtml(message);
    }

    function call(name) {
      var args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function (resolve, reject) {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          [name].apply(null, args);
      });
    }

    /* -------------------------------- boot -------------------------------- */

    function boot() {
      showState('loading', 'Loading…');
      call('uiBootstrap').then(function (data) {
        app.today = data.today;
        app.sections = data.sections;
        el('who').textContent = data.user;
        renderTabs();
        select(data.sections[0].key);
      }).catch(function (error) {
        showState('error', message(error));
      });
    }

    function message(error) {
      return (error && error.message) ? error.message : String(error);
    }

    function renderTabs() {
      el('tabs').innerHTML = app.sections.map(function (section) {
        return '<button type="button" role="tab" data-key="' + escapeHtml(section.key) + '"' +
          ' aria-selected="false">' + escapeHtml(section.label) + '</button>';
      }).join('');
    }

    function select(key) {
      // A form left open would still be showing the previous section's fields.
      if (app.form) closeForm();
      if (app.confirm) closeConfirm();
      app.current = key;
      app.meta = null;
      app.rows = [];
      app.filters = { status: '', category: '' };

      Array.prototype.forEach.call(el('tabs').children, function (tab) {
        tab.setAttribute('aria-selected', String(tab.dataset.key === key));
      });

      el('reference').style.display = 'none';
      el('filters').innerHTML = '';
      load();
    }

    function load() {
      var key = app.current;
      var archive = app.archive;
      showState('loading', 'Loading…');
      document.body.className = archive ? 'archive' : '';

      call(archive ? 'uiListArchive' : 'uiListEntries', key).then(function (data) {
        // A tab or view changed while this was in flight
        if (app.current !== key || app.archive !== archive) return;
        if (data.today) app.today = data.today;
        app.meta = data.meta;
        app.rows = data.rows;
        renderReference();
        renderFilters();
        renderTable();
        if (archive) {
          el('archiveCount').textContent = data.rows.length
            ? data.rows.length + (data.rows.length === 1 ? ' archived entry' : ' archived entries') +
              ' — deleted rows land here, and nothing is removed until you say so'
            : 'Nothing archived in ' + app.meta.label;
        }
      }).catch(function (error) {
        if (app.current !== key || app.archive !== archive) return;
        showState('error', message(error));
      });
    }

    function setArchive(on) {
      app.archive = on;
      el('showArchive').textContent = on ? 'Entries' : 'Archive';
      el('newEntry').style.display = on ? 'none' : '';
      load();
    }

    /* ------------------------------ reference ----------------------------- */

    function renderReference() {
      var box = el('reference');
      var items = app.meta.reference || [];
      if (!items.length) { box.style.display = 'none'; return; }

      el('referenceItems').innerHTML = items.map(function (item) {
        return '<button type="button" data-copy="' + escapeHtml(item.value) + '">' +
          '<span class="label">' + escapeHtml(item.label) + '</span>' +
          '<span class="value">' + escapeHtml(item.value) + '</span></button>';
      }).join('');
      box.style.display = 'block';
    }

    /* ------------------------------- filters ------------------------------ */

    /**
     * Options for the category filter: the declared list first, then anything
     * the rows actually hold that is not in it.
     *
     * The two halves are there for different reasons. The declared values make
     * the dropdown STABLE — the same reason the status filter is built from the
     * states rather than from the data, which is what stopped v1 growing one
     * option per claim date. The used-but-undeclared values are there because a
     * row holding an old value still exists and you have to be able to find it.
     *
     * Note this is the opposite of what the FORM does with the same list: the
     * form offers only declared values, because offering a stale one would
     * re-enter it. Here, hiding it would hide the row.
     */
    function categoryValues() {
      if (!app.meta.category) return [];
      var header = app.meta.category.header;
      var values = (app.meta.category.options || []).slice();

      var extra = {};
      app.rows.forEach(function (row) {
        var value = row.cells[header];
        if (value === '' || value === null || value === undefined) return;
        if (values.indexOf(value) === -1) extra[value] = true;
      });

      return values.concat(Object.keys(extra).sort());
    }

    function renderFilters() {
      // Three stable options per section rather than one per claim date, which
      // is what v1's dropdowns grew into.
      var html = '<label for="statusFilter">Status</label>' +
        '<select id="statusFilter"><option value="">All</option>' +
        app.meta.states.map(function (state) {
          return '<option value="' + escapeHtml(state.name) + '">' +
            escapeHtml(state.name) + '</option>';
        }).join('') + '</select>';

      if (app.meta.category) {
        var values = categoryValues();
        html += '<label for="categoryFilter">' + escapeHtml(app.meta.category.label) + '</label>' +
          '<select id="categoryFilter"><option value="">All</option>' +
          values.map(function (value) {
            return '<option value="' + escapeHtml(value) + '">' + escapeHtml(value) + '</option>';
          }).join('') + '</select>';
      }

      html += '<span class="count" id="count"></span>';
      el('filters').innerHTML = html;

      el('statusFilter').value = app.filters.status;
      if (el('categoryFilter')) el('categoryFilter').value = app.filters.category;
    }

    /* -------------------------------- table ------------------------------- */

    function visibleRows() {
      return app.rows.filter(function (row) {
        if (app.filters.status && row.status !== app.filters.status) return false;
        if (app.filters.category && app.meta.category &&
            row.cells[app.meta.category.header] !== app.filters.category) return false;
        return true;
      });
    }

    function renderTable() {
      var rows = visibleRows();
      var counter = el('count');

      if (!app.rows.length) {
        showState('empty', 'No entries in ' + app.meta.label + ' yet.');
        if (counter) counter.textContent = '';
        return;
      }
      if (!rows.length) {
        showState('empty', 'No entries match the current filter.');
        if (counter) counter.textContent = '0 of ' + app.rows.length;
        return;
      }

      var head = '<tr>' + app.meta.columns.map(function (column) {
        return '<th>' + escapeHtml(column.label) + '</th>';
      }).join('') + '<th>Status</th>';
      app.meta.states.forEach(function (state) {
        if (state.dateColumn) head += '<th>' + escapeHtml(state.dateColumn) + '</th>';
      });
      if (app.meta.files.length) head += '<th>Documents</th>';
      if (app.archive) head += '<th>Archived</th>';
      head += '<th></th></tr>';

      el('table').innerHTML = head + rows.map(rowHtml).join('');
      showState('rows');
      counter.textContent = rows.length === app.rows.length
        ? app.rows.length + (app.rows.length === 1 ? ' entry' : ' entries')
        : rows.length + ' of ' + app.rows.length;
    }

    function rowHtml(row) {
      var cells = app.meta.columns.map(function (column) {
        var value = row.cells[column.header];
        var cls = column.type === 'number' ? ' class="num"'
          : column.header === 'Notes' ? ' class="notes"' : '';
        var text = column.type === 'date' ? dayLabelOrRaw(value) : value;
        return '<td' + cls + '>' + escapeHtml(text) + '</td>';
      }).join('');

      // An archived row has no transitions, so its status is a fact rather than
      // a control. Offering a selector that cannot do anything would be worse
      // than showing none.
      if (app.archive) {
        cells += '<td>' + escapeHtml(row.status || '') + '</td>';
        app.meta.states.forEach(function (state) {
          if (!state.dateColumn) return;
          var iso = row.dates[state.dateColumn] || '';
          cells += '<td>' + (iso ? escapeHtml(dayLabel(iso)) : '—') + '</td>';
        });
        if (app.meta.files.length) {
          cells += '<td class="docs">' + (row.files.length
            ? row.files.map(function (file) {
                return '<a href="' + escapeHtml(file.url) + '" target="_blank" rel="noopener">' +
                  escapeHtml(file.label) + '</a>';
              }).join('')
            : '<span class="none">—</span>') + '</td>';
        }
        cells += '<td>' + escapeHtml(row.archivedAt ? dayLabel(row.archivedAt) : '') +
          (row.reason ? ' <span class="chip">' + escapeHtml(row.reason) + '</span>' : '') + '</td>';
        cells += '<td class="rowActions">' +
          '<button type="button" data-restore="' + row.row + '">Restore</button> ' +
          '<button type="button" class="danger" data-purge="' + row.row + '">Delete forever</button>' +
          '</td>';
        return '<tr data-row="' + row.row + '">' + cells + '</tr>';
      }

      // The status selector, not Done/Undo: three states cannot be a two-way
      // toggle, and going back is just picking an earlier one.
      cells += '<td><select class="status" data-row="' + row.row + '">' +
        app.meta.states.map(function (state) {
          return '<option value="' + escapeHtml(state.name) + '"' +
            (state.name === row.status ? ' selected' : '') + '>' +
            escapeHtml(state.name) + '</option>';
        }).join('') +
        (row.statusIndex === -1
          ? '<option value="" selected>' + escapeHtml(row.status || '(none)') + '</option>'
          : '') +
        '</select></td>';

      app.meta.states.forEach(function (state, index) {
        if (!state.dateColumn) return;
        var iso = row.dates[state.dateColumn] || '';
        // Only a state the row has REACHED gets an editable chip. A date for a
        // later state is one setStatus clears on the next transition, so the
        // server refuses it and offering the control would be inviting you to
        // write something that vanishes. An existing date stays editable
        // whatever the status, so a hand-edited row can still be repaired.
        var editable = !!iso || (row.statusIndex >= 0 && index <= row.statusIndex);
        cells += '<td>' + (editable
          ? '<button type="button" class="chip' + (iso ? '' : ' blank') +
            '" data-date-row="' + row.row + '" data-date-column="' +
            escapeHtml(state.dateColumn) + '">' +
            (iso ? escapeHtml(dayLabel(iso)) : '—') + '</button>'
          : '<span class="chip unreached" title="Select ' + escapeHtml(state.name) +
            ' to set this">—</span>') + '</td>';
      });

      if (app.meta.files.length) {
        cells += '<td class="docs">' + (row.files.length
          ? row.files.map(function (file) {
              return '<a href="' + escapeHtml(file.url) + '" target="_blank" rel="noopener">' +
                escapeHtml(file.label) + '</a>';
            }).join('')
          : '<span class="none' + (row.receiptState === 'awaiting' ? ' awaiting' : '') + '">' +
            escapeHtml(row.receiptState || 'none') + '</span>') + '</td>';
      }

      cells += '<td class="rowActions">' +
        '<button type="button" data-edit="' + row.row + '">Edit</button> ' +
        '<button type="button" data-delete="' + row.row + '">Delete</button></td>';

      return '<tr data-row="' + row.row + '">' + cells + '</tr>';
    }

    function dayLabelOrRaw(value) {
      return /^\d{4}-\d{2}-\d{2}$/.test(String(value || '')) ? dayLabel(value) : value;
    }

    function findRow(rowNumber) {
      return app.rows.filter(function (row) { return row.row === Number(rowNumber); })[0];
    }

    function replaceRow(entry) {
      if (!entry) return;
      app.rows = app.rows.map(function (row) { return row.row === entry.row ? entry : row; });
    }

    function setBusy(rowNumber, busy) {
      var tr = el('table').querySelector('tr[data-row="' + rowNumber + '"]');
      if (tr) tr.className = busy ? 'busy' : '';
    }

    /* ------------------------------- dialog ------------------------------- */

    /**
     * Open the date dialog.
     *
     * spec.keepExisting comes from the server, which knows whether the target
     * state already holds a date. When it does the primary button reads
     * "Keep 15 Jan", because setStatus only fills a blank date — a button
     * saying "Today" would be a lie on the revert path.
     */
    function openDialog(spec) {
      app.dialog = spec;
      var prefill = spec.existingDate || app.today;

      el('dialogTitle').textContent = spec.title;
      el('dialogPrimary').textContent = spec.keepExisting
        ? 'Keep ' + dayLabel(spec.existingDate)
        : 'Today — ' + dayLabel(app.today);
      el('dialogDate').value = prefill;
      el('dialogClear').style.display = spec.allowClear ? '' : 'none';
      el('overlay').className = 'open';
    }

    function closeDialog(cancelled) {
      var spec = app.dialog;
      app.dialog = null;
      el('overlay').className = '';
      if (cancelled && spec && spec.onCancel) spec.onCancel();
    }

    function acceptDialog(dateISO) {
      var spec = app.dialog;
      if (!spec) return;
      app.dialog = null;
      el('overlay').className = '';
      spec.apply(dateISO);
    }

    /* ------------------------------- actions ------------------------------ */

    function changeStatus(rowNumber, stateName) {
      var row = findRow(rowNumber);
      if (!row) return;

      var option = row.options.filter(function (o) { return o.state === stateName; })[0];
      if (!option) return;

      // A state with no date column of its own — Work's "To Do" — needs no
      // dialog at all.
      if (!option.dateColumn) return applyStatus(rowNumber, stateName, '');

      openDialog({
        title: 'Mark as ' + stateName,
        existingDate: option.existingDate,
        keepExisting: option.keepExisting,
        allowClear: false,
        apply: function (dateISO) { applyStatus(rowNumber, stateName, dateISO); },
        onCancel: function () { renderTable(); }
      });
    }

    function applyStatus(rowNumber, stateName, dateISO) {
      setBusy(rowNumber, true);
      call('uiSetStatus', app.current, rowNumber, stateName, dateISO)
        .then(function (result) {
          replaceRow(result.entry);
          renderFilters();
          renderTable();
          // Never report success for work that failed: the status moved, and if
          // a rename did not, that is what gets said.
          if (result.fileErrors && result.fileErrors.length) {
            toast(stateName + ' saved, but the document could not be filed:\n' +
              result.fileErrors.map(function (f) {
                return f.column + ': ' + (f.error || 'unknown error');
              }).join('\n'), 'warn');
          } else {
            toast(stateName + (result.date ? ' — ' + dayLabel(result.date) : ''));
          }
        })
        .catch(function (error) {
          setBusy(rowNumber, false);
          renderTable();  // put the selector back to what the sheet still says
          toast(message(error), 'error');
        });
    }

    function editDate(rowNumber, dateColumn) {
      var row = findRow(rowNumber);
      if (!row) return;
      var existing = row.dates[dateColumn] || '';

      openDialog({
        title: dateColumn,
        existingDate: existing,
        keepExisting: !!existing,
        allowClear: !!existing,
        apply: function (dateISO) { applyDate(rowNumber, dateColumn, dateISO); }
      });
    }

    function applyDate(rowNumber, dateColumn, dateISO) {
      setBusy(rowNumber, true);
      call('uiSetEntryDate', app.current, rowNumber, dateColumn, dateISO)
        .then(function (result) {
          replaceRow(result.entry);
          renderTable();
          toast(dateColumn + (result.date ? ' — ' + dayLabel(result.date) : ' cleared'));
        })
        .catch(function (error) {
          setBusy(rowNumber, false);
          toast(message(error), 'error');
        });
    }

    /* --------------------- archive, restore, destroy ---------------------- */

    /**
     * Confirmations exist here and nowhere else.
     *
     * Status changes have none, deliberately — every one is reversible, and a
     * confirmation on a frequent action only trains you to tap through it.
     * These two are the exceptions: deleting is reversible but not obviously
     * so, and Delete forever is not reversible at all.
     */
    function openConfirm(spec) {
      app.confirm = spec;
      el('confirmTitle').textContent = spec.title;
      el('confirmBody').textContent = spec.body;
      el('confirmOk').textContent = spec.okLabel;
      el('confirmOk').className = 'primary' + (spec.destructive ? ' destructive' : '');
      el('confirmOverlay').className = 'open';
    }

    function closeConfirm() {
      app.confirm = null;
      el('confirmOverlay').className = '';
    }

    function acceptConfirm() {
      var spec = app.confirm;
      if (!spec) return;
      closeConfirm();
      spec.apply();
    }

    function deleteEntry(rowNumber) {
      var row = findRow(rowNumber);
      if (!row) return;
      // Keyed by header, not by the section's display label — cells always uses
      // the column name. The label is what the heading says, not what the key is.
      var who = row.cells['Counterparty'] || 'this entry';

      openConfirm({
        title: 'Delete this entry?',
        body: who + ' moves to the archive, and its documents to the Archived folder. ' +
          'Nothing is removed — you can restore it, or delete it for good from there.',
        okLabel: 'Delete',
        destructive: false,
        apply: function () {
          setBusy(rowNumber, true);
          call('uiArchiveEntry', app.current, rowNumber)
            .then(function (result) {
              load();
              if (result.fileErrors && result.fileErrors.length) {
                toast('Archived, but a document could not be moved:\n' +
                  result.fileErrors.map(function (f) {
                    return f.column + ': ' + (f.error || 'unknown error');
                  }).join('\n'), 'warn');
              } else {
                toast('Moved to the archive');
              }
            })
            .catch(function (error) {
              setBusy(rowNumber, false);
              toast(message(error), 'error');
            });
        }
      });
    }

    function restoreRow(rowNumber) {
      setBusy(rowNumber, true);
      call('uiRestoreEntry', app.current, rowNumber)
        .then(function (result) {
          load();
          if (result.fileErrors && result.fileErrors.length) {
            toast('Restored, but a document could not be re-filed:\n' +
              result.fileErrors.map(function (f) {
                return f.column + ': ' + (f.error || 'unknown error');
              }).join('\n'), 'warn');
          } else {
            toast('Restored');
          }
        })
        .catch(function (error) {
          setBusy(rowNumber, false);
          toast(message(error), 'error');
        });
    }

    function purgeEntry(rowNumber) {
      var row = findRow(rowNumber);
      var who = row ? (row.cells['Counterparty'] || 'this entry') : 'this entry';

      openConfirm({
        title: 'Delete forever?',
        body: who + ' and its documents are removed. Documents go to Drive\'s trash, ' +
          'where they last 30 days; the row itself cannot be recovered.',
        okLabel: 'Delete forever',
        destructive: true,
        apply: function () {
          setBusy(rowNumber, true);
          call('uiHardDeleteEntry', app.current, rowNumber)
            .then(function (result) {
              load();
              if (result.fileErrors && result.fileErrors.length) {
                toast('Row deleted, but a document could not be trashed:\n' +
                  result.fileErrors.map(function (f) {
                    return f.column + ': ' + (f.error || 'unknown error');
                  }).join('\n'), 'warn');
              } else {
                toast('Deleted');
              }
            })
            .catch(function (error) {
              setBusy(rowNumber, false);
              toast(message(error), 'error');
            });
        }
      });
    }

    function copyValue(value) {
      var done = function () { toast('Copied ' + value); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(value).then(done, function () { fallbackCopy(value, done); });
      } else {
        fallbackCopy(value, done);
      }
    }

    function fallbackCopy(value, done) {
      var field = document.createElement('textarea');
      field.value = value;
      field.style.position = 'fixed';
      field.style.opacity = '0';
      document.body.appendChild(field);
      field.select();
      try { document.execCommand('copy'); done(); }
      catch (e) { toast('Could not copy — ' + value, 'error'); }
      document.body.removeChild(field);
    }

    /* -------------------------------- form -------------------------------- */

    /* Mirrors MAX_UPLOAD_BYTES in Form.js, so an oversized file is refused here
       rather than after a slow upload. The server still enforces it — this is
       courtesy, not the check. */
    var MAX_UPLOAD_BYTES = 10 * 1024 * 1024;

    /**
     * The new-entry form, and the edit form, are the same form.
     *
     * Editing is not a special mode — the fields come from the same config and
     * the server runs the same validation, so an edited row cannot end up less
     * valid than a created one. The only differences here are which field list
     * is used, what is prefilled, and which function Save calls.
     */
    function openForm(editRow) {
      if (!app.meta) return;
      var row = editRow ? findRow(editRow) : null;
      if (editRow && !row) return;

      app.form = { busy: false, saveAnyway: false, row: row ? row.row : null };
      var fields = row ? app.meta.edit : app.meta.form;

      el('formTitle').textContent = row
        ? 'Edit — ' + app.meta.label
        : 'New — ' + app.meta.label;
      el('formNote').className = '';
      // Reset here rather than after a save. A successful save closes the form,
      // so resetting on the way out of saveForm() would have to be repeated on
      // every exit path - and the one it was missing from was the successful
      // one, which left the next form opening with the button reading "Saving…".
      el('formSave').textContent = 'Save';
      el('formFields').innerHTML = fields.map(function (field) {
        return fieldHtml(field, row);
      }).join('');
      el('formOverlay').className = 'open';

      // The values already in use, so an expense reason is a pick rather than a
      // retype. Fetched on open because it changes as you enter entries, unlike
      // the field list itself. A category with a declared list is already a
      // dropdown and needs no round trip.
      var categoryField = app.meta.form.filter(function (f) {
        return f.role === 'category';
      })[0];
      if (app.meta.category && categoryField) {
        call('uiCategoryValues', app.current).then(function (values) {
          var list = el('list_' + cssId(app.meta.category.header));
          if (list) {
            list.innerHTML = values.map(function (value) {
              return '<option value="' + escapeHtml(value) + '"></option>';
            }).join('');
          }
        }).catch(function () { /* suggestions are optional; typing still works */ });
      }
    }

    function closeForm() {
      app.form = null;
      el('formOverlay').className = '';
      el('formFields').innerHTML = '';
    }

    /** A DOM-safe id for a header that may contain spaces or accents. */
    function cssId(header) {
      return String(header).replace(/[^A-Za-z0-9]/g, '_');
    }

    function fieldHtml(field, row) {
      var id = 'f_' + cssId(field.header);
      var listId = 'list_' + cssId(field.header);
      var label = '<label for="' + id + '">' + escapeHtml(field.label) +
        (field.required ? '<span class="req">*</span>' : '') + '</label>';

      // Editing prefills from the row; creating prefills from config.
      var existing = row ? row.cells[field.header] : undefined;
      if (existing === undefined || existing === null) existing = '';

      var input;
      var hint = '';
      if (field.type === 'file') {
        input = '<input type="file" id="' + id + '" data-header="' +
          escapeHtml(field.header) + '">';
        if (row) {
          var attached = (row.files || []).filter(function (f) {
            return f.label === field.label;
          })[0];
          hint = attached
            ? 'Attached already. Choosing a file replaces it, and the old one goes to Drive\'s trash.'
            : 'Not attached yet.';
        }

      } else if (field.type === 'choice') {
        input = '<select id="' + id + '" data-header="' + escapeHtml(field.header) + '">' +
          '<option value=""></option>' +
          (field.options || []).map(function (option) {
            return '<option value="' + escapeHtml(option) + '"' +
              (String(existing) === option ? ' selected' : '') + '>' +
              escapeHtml(option) + '</option>';
          }).join('') + '</select>';

      } else if (field.type === 'date') {
        // Native, so iOS opens the system wheel — same reason as the date dialog.
        var value = row ? String(existing)
          : (field.header === 'Date' ? app.today : '');
        input = '<input type="date" id="' + id + '" data-header="' +
          escapeHtml(field.header) + '" value="' + escapeHtml(value) + '">';

      } else if (field.type === 'number') {
        input = '<input type="number" step="0.01" inputmode="decimal" id="' + id +
          '" data-header="' + escapeHtml(field.header) + '" value="' +
          escapeHtml(existing) + '">';

      } else {
        var suggest = (field.role === 'counterparty' || field.role === 'category');
        input = '<input type="text" id="' + id + '" data-header="' + escapeHtml(field.header) + '"' +
          (field.role ? ' data-role="' + escapeHtml(field.role) + '"' : '') +
          (suggest ? ' list="' + listId + '" autocomplete="off"' : '') +
          ' value="' + escapeHtml(row ? existing : (field.defaultValue || '')) + '">' +
          (suggest ? '<datalist id="' + listId + '"></datalist>' : '');
      }

      return '<div class="field" data-field="' + escapeHtml(field.header) + '">' + label + input +
        '<div class="hint" id="hint_' + cssId(field.header) + '">' + escapeHtml(hint) +
        '</div></div>';
    }

    /** The counterparty field, found by role rather than by position. */
    function counterpartyHeader() {
      var field = app.meta.form.filter(function (f) { return f.role === 'counterparty'; })[0];
      return field ? field.header : '';
    }

    function fieldInput(header) {
      return el('f_' + cssId(header));
    }

    /* ------------------------- registry, as you type ----------------------- */

    var suggestTimer = null;
    function counterpartySuggest(text) {
      clearTimeout(suggestTimer);
      suggestTimer = setTimeout(function () {
        if (!app.form) return;
        call('uiSuggestCounterparty', text, 8).then(function (matches) {
          if (!app.form) return;
          var list = el('list_' + cssId(counterpartyHeader()));
          if (!list) return;
          list.innerHTML = matches.map(function (match) {
            return '<option value="' + escapeHtml(match.name) + '"></option>';
          }).join('');
        }).catch(function () { /* suggestions are optional */ });
      }, 180);
    }

    /**
     * Ask the registry what it knows once a name is settled.
     *
     * Below the confidence bar nothing is filled in — the suggestion is offered
     * as a button instead. A wrong NIF means a rejected claim, which is worse
     * than a blank field, so guessing is not on the table.
     */
    function counterpartyLookup(text) {
      var hint = el('hint_' + cssId(counterpartyHeader()));
      if (!text || !hint) return;

      call('uiLookupCounterparty', app.current, text).then(function (match) {
        if (!app.form || !match) { if (hint) hint.textContent = ''; return; }

        if (match.autofill) {
          var filled = [];
          Object.keys(match.prefill).forEach(function (header) {
            var input = fieldInput(header);
            if (!input || input.value) return;   // never overwrite what you typed
            input.value = match.prefill[header];
            filled.push(header);
          });
          hint.className = 'hint';
          hint.textContent = filled.length ? 'Filled ' + filled.join(', ') + ' from the registry' : '';
        } else {
          hint.className = 'hint suggest';
          hint.innerHTML = 'Did you mean <button type="button" data-use-name="' +
            escapeHtml(match.name) + '">' + escapeHtml(match.name) + '</button>?';
        }
      }).catch(function () { /* the registry is an aid, never a blocker */ });
    }

    function useSuggestedName(name) {
      var input = fieldInput(counterpartyHeader());
      if (!input) return;
      input.value = name;
      counterpartyLookup(name);
    }

    /* -------------------------------- saving ------------------------------- */

    function formFields() {
      return (app.form && app.form.row) ? app.meta.edit : app.meta.form;
    }

    /**
     * Read the form.
     *
     * Editing sends every field including the blanks, because a blank is how
     * you clear a value — the server treats a supplied blank as "clear this".
     * Creating omits them, so a new row is not written full of empty strings.
     */
    function collectValues() {
      var editing = !!(app.form && app.form.row);
      var values = {};
      formFields().forEach(function (field) {
        if (field.type === 'file') return;
        var input = fieldInput(field.header);
        if (!input) return;
        var value = input.value;
        var blank = (value === null || value === undefined || String(value).trim() === '');
        if (blank && !editing) return;
        values[field.header] = (!blank && field.type === 'number')
          ? Number(value) : String(value === null || value === undefined ? '' : value).trim();
      });
      return values;
    }

    function missingRequired(values) {
      return formFields().filter(function (field) {
        return field.required && field.type !== 'file' &&
          (values[field.header] === undefined || values[field.header] === '');
      });
    }

    /** Read every chosen file as base64, in parallel. */
    function collectFiles() {
      var fileFields = formFields().filter(function (field) { return field.type === 'file'; });
      var reads = [];

      fileFields.forEach(function (field) {
        var input = fieldInput(field.header);
        if (!input || !input.files || !input.files.length) return;
        var file = input.files[0];

        if (file.size > MAX_UPLOAD_BYTES) {
          reads.push(Promise.reject(new Error(
            field.label + ': ' + Math.round(file.size / 1024 / 1024) + ' MB is too large (limit ' +
            Math.round(MAX_UPLOAD_BYTES / 1024 / 1024) + ' MB)')));
          return;
        }

        reads.push(new Promise(function (resolve, reject) {
          var reader = new FileReader();
          reader.onload = function () {
            resolve({
              header: field.header,
              name: file.name,
              mimeType: file.type || 'application/octet-stream',
              data: String(reader.result).split(',')[1] || ''
            });
          };
          reader.onerror = function () { reject(new Error(field.label + ': could not be read')); };
          reader.readAsDataURL(file);
        }));
      });

      return Promise.all(reads);
    }

    function saveForm() {
      if (!app.form || app.form.busy) return;

      var values = collectValues();
      var missing = missingRequired(values);

      Array.prototype.forEach.call(el('formFields').children, function (node) {
        node.className = 'field';
      });

      // Not a hard block: an entry you cannot complete yet is still worth having,
      // and the server writes it and says what is outstanding. But it is not the
      // normal case, so it takes a second, deliberate tap.
      if (missing.length && !app.form.saveAnyway) {
        missing.forEach(function (field) {
          var node = el('formFields').querySelector('[data-field="' + field.header + '"]');
          if (node) node.className = 'field missing';
        });
        el('formNote').className = 'show';
        el('formNote').textContent = 'Still needed: ' +
          missing.map(function (f) { return f.label; }).join(', ') +
          '. Press again to save it incomplete.';
        // The button now says what pressing it does. Fill the fields in and it
        // saves a complete entry regardless - this is a relabel, not a mode.
        el('formSave').textContent = 'Save incomplete';
        app.form.saveAnyway = true;
        return;
      }

      app.form.busy = true;
      el('formSave').textContent = 'Saving…';

      var editingRow = app.form.row;

      collectFiles()
        .then(function (files) {
          var payload = { values: values, files: files };
          return editingRow
            ? call('uiUpdateEntry', app.current, editingRow, payload)
            : call('uiCreateEntry', app.current, payload);
        })
        .then(function (result) {
          closeForm();
          load();
          if (result.fileErrors && result.fileErrors.length) {
            toast('Saved, but a document could not be filed:\n' +
              result.fileErrors.map(function (f) {
                return f.column + ': ' + (f.error || 'unknown error');
              }).join('\n'), 'warn');
          } else if (result.ok === false) {
            toast('Saved, but incomplete — ' + (result.error || 'missing fields') +
              (editingRow ? '' : '\nA completion request has been emailed.'), 'warn');
          } else {
            toast(editingRow ? 'Updated' : 'Saved');
          }
        })
        .catch(function (error) {
          if (!app.form) return;
          app.form.busy = false;
          el('formSave').textContent = 'Save';
          toast(message(error), 'error');
        });
    }

    /* ------------------------------- events ------------------------------- */

    document.addEventListener('click', function (event) {
      var target = event.target.closest('button, a');
      if (!target) return;

      if (target.parentNode === el('tabs')) return select(target.dataset.key);
      if (target.id === 'refresh') return load();
      if (target.id === 'newEntry') return openForm();
      if (target.id === 'showArchive') return setArchive(!app.archive);
      if (target.id === 'archiveBack') return setArchive(false);
      if (target.dataset.edit) return openForm(Number(target.dataset.edit));
      if (target.dataset.delete) return deleteEntry(Number(target.dataset.delete));
      if (target.dataset.restore) return restoreRow(Number(target.dataset.restore));
      if (target.dataset.purge) return purgeEntry(Number(target.dataset.purge));
      if (target.id === 'confirmOk') return acceptConfirm();
      if (target.id === 'confirmCancel') return closeConfirm();
      if (target.id === 'formSave') return saveForm();
      if (target.id === 'formCancel') return closeForm();
      if (target.dataset.useName) return useSuggestedName(target.dataset.useName);
      if (target.dataset.copy !== undefined) return copyValue(target.dataset.copy);
      if (target.dataset.dateRow) return editDate(target.dataset.dateRow, target.dataset.dateColumn);
      if (target.id === 'dialogPrimary') return acceptDialog(el('dialogDate').value);
      if (target.id === 'dialogOk') return acceptDialog(el('dialogDate').value);
      if (target.id === 'dialogClear') return acceptDialog('');
      if (target.id === 'dialogCancel') return closeDialog(true);
    });

    el('overlay').addEventListener('click', function (event) {
      if (event.target === el('overlay')) closeDialog(true);
    });

    el('formOverlay').addEventListener('click', function (event) {
      // Only the backdrop closes it. A half-filled form thrown away by a stray
      // tap inside the card would be worse than one extra tap on Cancel.
      if (event.target === el('formOverlay') && app.form && !app.form.busy) closeForm();
    });

    // Typing in the counterparty box: suggest while typing, look up once it
    // settles. Both are debounced by the browser's own change semantics.
    document.addEventListener('input', function (event) {
      if (!app.form) return;
      if (event.target.dataset && event.target.dataset.role === 'counterparty') {
        counterpartySuggest(event.target.value);
      }
    });

    el('confirmOverlay').addEventListener('click', function (event) {
      if (event.target === el('confirmOverlay')) closeConfirm();
    });

    document.addEventListener('keydown', function (event) {
      if (app.confirm) {
        if (event.key === 'Escape') { event.preventDefault(); closeConfirm(); }
        return;
      }
      if (app.form) {
        if (event.key === 'Escape' && !app.form.busy) {
          // preventDefault for the same reason as the date dialog: without it
          // the browser also leaves fullscreen, which reads as the window going.
          event.preventDefault();
          closeForm();
        }
        return;
      }
      if (!app.dialog) return;
      if (event.key === 'Escape') {
        // Without this the browser also acts on Escape — leaving fullscreen,
        // which reads as the window disappearing rather than a dialog closing.
        event.preventDefault();
        closeDialog(true);
      }
      if (event.key === 'Enter') {
        event.preventDefault();
        acceptDialog(el('dialogDate').value);
      }
    });

    document.addEventListener('change', function (event) {
      var target = event.target;
      if (app.form && target.dataset && target.dataset.role === 'counterparty') {
        return counterpartyLookup(target.value);
      }
      if (target.classList.contains('status')) {
        return changeStatus(target.dataset.row, target.value);
      }
      if (target.id === 'statusFilter') {
        app.filters.status = target.value;
        return renderTable();
      }
      if (target.id === 'categoryFilter') {
        app.filters.category = target.value;
        return renderTable();
      }
    });

    boot();
  </script>
</body>
</html>
